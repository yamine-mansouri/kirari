# Publie le Storybook sur GitHub Pages à chaque push sur `main`.
#
# Le Storybook est la source de vérité du design system : le garder en ligne
# évite d'avoir à cloner le dépôt et lancer un serveur pour consulter un
# composant.
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le déploiement Pages a besoin d'écrire, et d'un jeton OIDC pour s'authentifier.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. `cancel-in-progress: false` : on laisse un
# déploiement en cours se terminer plutôt que de laisser le site à moitié
# publié.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La version de pnpm vient du champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kirari-ds/storybook build

      - uses: actions/configure-pages@v6

      # Les chemins d'assets générés par Storybook sont relatifs, donc le site
      # fonctionne tel quel dans le sous-répertoire /kirari/ que sert Pages.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
