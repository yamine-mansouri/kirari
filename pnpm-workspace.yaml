packages:
  - "packages/*"
  - "apps/*"

# pnpm 11 bloque les scripts d'installation par défaut. esbuild (dépendance de
# tsup et de vite) installe son binaire natif dans un postinstall : sans cette
# autorisation explicite, aucun build ne fonctionne.
allowBuilds:
  esbuild: true
  playwright: true
